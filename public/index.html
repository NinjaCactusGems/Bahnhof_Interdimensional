<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abfahrten</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=IM+Fell+English+SC&family=IM+Fell+English&family=Nixie+One&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
  <main class="frame">
    <div class="board">
      <h1 class="title">Abfahrten</h1>

      <section class="finale">
        <div class="paper"><div class="finale-name scrap" id="final-name">&nbsp;</div></div>
        <div class="clock big" id="final-clock"></div>
      </section>

      <div id="tracks"></div>
    </div>
  </main>

  <svg id="pipes" aria-hidden="true"></svg>
  <canvas id="steam" aria-hidden="true"></canvas>
  </div>
  <div id="res-badge" hidden></div>

  <dialog id="settings">
    <form method="dialog" id="settings-form">
      <h2>Stellwerk</h2>
      <fieldset>
        <legend>Letzte Abfahrt</legend>
        <label>Ereignis <input name="final-name" maxlength="60" required></label>
        <label>Zeitpunkt <input name="final-at" type="datetime-local" required></label>
      </fieldset>
      <div id="track-fields"></div>
      <label class="pw">Passwort <input name="pw" type="password" autocomplete="current-password" required></label>
      <p class="msg" id="settings-msg" role="status"></p>
      <div class="buttons">
        <button type="button" id="settings-cancel">Abbrechen</button>
        <button type="submit">Speichern</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
